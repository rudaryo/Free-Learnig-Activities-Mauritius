<style>

.scene{position:relative;width:min(1000px,100%);background:linear-gradient(#bfeee8,#9fdcd3);border-radius:22px;padding:clamp(30px,6vw,56px) clamp(8px,2vw,22px) 0;box-shadow:0 12px 34px rgba(0,0,0,.22);overflow:hidden}
.deco{position:absolute;top:6px;left:0;right:0;display:flex;justify-content:space-around;font-size:clamp(1.1rem,3.4vw,2rem);pointer-events:none}
.deco span{display:inline-block;animation:bob 2.6s ease-in-out infinite}
.deco span:nth-child(2n){animation-delay:.6s}.deco span:nth-child(3n){animation-delay:1.1s}
.frame{background:linear-gradient(#e3a85d,#b7793c);border-radius:14px;padding:clamp(8px,1.6vw,16px);box-shadow:inset 0 3px 0 rgba(255,255,255,.35),0 6px 0 #7a4a1e}
.board{background:radial-gradient(ellipse at 30% 20%,#47a191,#2f7a6c 55%,#1d5248);border-radius:8px;padding:clamp(10px,2vw,20px);position:relative;min-height:clamp(320px,52vw,480px)}

.rainbow{font-size:clamp(1.6rem,6.5vw,3.4rem);font-weight:900;letter-spacing:2px;line-height:1;white-space:nowrap}

.tileW{border-radius:clamp(8px,1.4vw,14px);background:linear-gradient(145deg,#a46d3a,#6b4420);box-shadow:inset 0 0 0 clamp(2px,.4vw,4px) #e9b46a,inset 0 0 0 clamp(4px,.8vw,7px) #5a3412,0 4px 0 #3e230b;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .15s}

.pbtn{font:inherit;font-weight:bold;font-size:1.05rem;border:none;border-radius:14px;padding:10px 18px;margin:6px;cursor:pointer;background:#34c759;color:#fff;box-shadow:0 4px 0 #1f8a3a}

@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

@keyframes wave{0%,100%{transform:translateY(0) rotate(0)}25%{transform:translateY(-6px) rotate(-3deg)}75%{transform:translateY(3px) rotate(3deg)}}
@keyframes hop{0%,100%{transform:translateY(0) scale(1)}30%{transform:translateY(-22px) scale(1.05,.95)}60%{transform:translateY(0) scale(1.08,.92)}}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
@keyframes ring{0%{box-shadow:0 6px 0 #1b5e20,0 0 0 0 rgba(255,255,255,.55)}100%{box-shadow:0 6px 0 #1b5e20,0 0 0 22px rgba(255,255,255,0)}}

<script>
const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const COUL=["#ff595e","#ff924c","#ffca3a","#8ac926","#52a675","#1982c4","#4267ac","#6a4c93","#f15bb5","#00bbf9"];
// un mot et une image pour chaque lettre
const MOTS={A:["ananas","🍍"],B:["ballon","🎈"],C:["chat","🐱"],D:["dauphin","🐬"],E:["éléphant","🐘"],F:["fraise","🍓"],G:["gâteau","🎂"],H:["hibou","🦉"],I:["île","🏝️"],J:["jus","🧃"],K:["kangourou","🦘"],L:["lion","🦁"],M:["maison","🏠"],N:["nuage","☁️"],O:["orange","🍊"],P:["pomme","🍎"],Q:["quille","🎳"],R:["robot","🤖"],S:["soleil","☀️"],T:["tortue","🐢"],U:["usine","🏭"],V:["vélo","🚲"],W:["wagon","🚃"],X:["xylophone","🎶"],Y:["yoyo","🪀"],Z:["zèbre","🦓"]};
const BRAVO=["Bravo !","Super !","Génial !","Bien joué !","Oui !","Excellent !"];
const $=id=>document.getElementById(id);
let minus=false,son=true,cur="A",modeCur="learn";
try{minus=localStorage.getItem("alpha_min")==="1";son=localStorage.getItem("alpha_son")!=="0";}catch(e){}
const aff=l=>minus?l.toLowerCase():l, coul=l=>COUL[ALPHA.indexOf(l)%COUL.length];
const Lspan=(l,txt)=>`<span class="L" style="color:${coul(l)}">${txt===undefined?aff(l):txt}</span>`;
function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
// ---------- voix et sons ----------
let voixFR=null;
function chargerVoix(){try{const v=speechSynthesis.getVoices();voixFR=v.find(x=>/^fr(-|_)FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null;}catch(e){}}
try{chargerVoix();speechSynthesis.onvoiceschanged=chargerVoix;}catch(e){}
function dire(t,fin){if(!son){if(fin)setTimeout(fin,500);return;}try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voixFR)u.voice=voixFR;u.rate=.85;u.pitch=1.15;if(fin){u.onend=fin;u.onerror=fin;}speechSynthesis.speak(u);}catch(e){if(fin)fin();}}
let AC=null;
function bip(notes,type="sine",dur=.12){if(!son)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 notes.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;});}catch(e){}}
const sTap=()=>bip([660,880],"triangle",.08),sOk=()=>bip([660,880,1175],"triangle",.11),sNon=()=>bip([300,220],"sawtooth",.15),sGagne=()=>bip([523,659,784,1047,784,1047],"triangle",.14),sFlip=()=>bip([440],"sine",.06);
function toggleSon(){son=!son;try{localStorage.setItem("alpha_son",son?"1":"0")}catch(e){}$("sonBtn").textContent=son?"🔊":"🔇";if(!son)speechSynthesis.cancel();}
// ---------- chouette ----------
document.querySelectorAll(".owlSlot").forEach(s=>s.replaceWith($("owlTpl").content.cloneNode(true)));
setInterval(()=>document.querySelectorAll(".owl").forEach(o=>{o.classList.add("blink");setTimeout(()=>o.classList.remove("blink"),160);}),3200);
function lulu(cls,txt){document.querySelectorAll(".owl").forEach(o=>{o.classList.remove("hop","sad");void o.offsetWidth;if(cls)o.classList.add(cls);});if(txt!==undefined)$("bubble").innerHTML=txt;}
$("titre").innerHTML="L'ALPHABET".split("").map((c,i)=>`<span style="color:${["#ff595e","#ffca3a","#8ac926","#1982c4","#ff924c","#6a4c93","#f15bb5","#00bbf9","#ff595e","#52a675"][i]};animation-delay:${i*.12}s">${c}</span>`).join("");
// ---------- modes ----------
function mode(m){modeCur=m;chant=false;$("chantBtn").textContent="🎵 Écouter tout";speechSynthesis.cancel();
 document.querySelectorAll(".mode").forEach(b=>b.classList.toggle("on",b.dataset.m===m));
 document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id==="p-"+m));
 if(m==="learn"){dessinerLearn();lulu("hop","Touche une lettre pour l'écouter !");}
 if(m==="quiz")startQuiz();
 if(m==="match")startMatch();}
function recommencer(){mode(modeCur);}
function toggleCase(){minus=!minus;try{localStorage.setItem("alpha_min",minus?"1":"0")}catch(e){}$("bx").textContent=minus?"✔":"";
 if(modeCur==="learn")dessinerLearn();if(modeCur==="quiz")dessinerOpts();if(modeCur==="match")dessinerMatch();}
// ---------- APPRENDRE ----------
function dessinerLearn(){
 $("agrid").innerHTML=ALPHA.map(l=>`<div class="tileW${l===cur?" say":""}" data-l="${l}" onclick="choisirL('${l}')">${Lspan(l)}<span class="mini">${MOTS[l][1]}</span></div>`).join("");
 grand(cur);}
function grand(l){$("bigCard").innerHTML=`<div>${Lspan(l,l)} ${Lspan(l,l.toLowerCase())}</div><div><div class="pic">${MOTS[l][1]}</div><div class="word"><b>${aff(l)}</b> comme ${MOTS[l][0]}</div></div>`;}
function choisirL(l){cur=l;sTap();document.querySelectorAll(".agrid .tileW").forEach(t=>{t.classList.remove("say");if(t.dataset.l===l){void t.offsetWidth;t.classList.add("say");}});grand(l);direLettre(l);lulu("hop",`<span style="color:${coul(l)}">${aff(l)}</span> comme ${MOTS[l][0]} ${MOTS[l][1]}`);}
function direLettre(l){dire(l.toLowerCase()===l?l:l+", comme "+MOTS[l][0]);}
function voisin(d){const i=(ALPHA.indexOf(cur)+d+26)%26;choisirL(ALPHA[i]);}
let chant=false;
function chanter(){if(chant){chant=false;speechSynthesis.cancel();$("chantBtn").textContent="🎵 Écouter tout";return;}
 chant=true;$("chantBtn").textContent="⏹ Arrêter";let i=0;lulu("hop","On chante l'alphabet ensemble ! 🎵");
 const suite=()=>{if(!chant||modeCur!=="learn")return;if(i>=26){chant=false;$("chantBtn").textContent="🎵 Écouter tout";lulu("hop","Bravo ! Tu connais tout l'alphabet ! 🌟");sGagne();return;}
  const l=ALPHA[i++];cur=l;document.querySelectorAll(".agrid .tileW").forEach(t=>{t.classList.remove("say");if(t.dataset.l===l){void t.offsetWidth;t.classList.add("say");}});grand(l);dire(l,()=>setTimeout(suite,120));};
 suite();}
// ---------- QUIZ ----------
let qL="",qOpts=[],qOk=0,qN=0,streak=0,qBloque=false;const QTOT=10;
function startQuiz(){qOk=0;qN=0;streak=0;majQ();question();}
function majQ(){$("qOk").textContent=qOk;$("qStreak").textContent=streak;$("qProg").style.width=(qN/QTOT*100)+"%";}
function question(){qBloque=false;qErr=false;qL=ALPHA[Math.floor(Math.random()*26)];qOpts=melange([qL,...melange(ALPHA.filter(x=>x!==qL)).slice(0,2)]);dessinerOpts();
 lulu(null,`Question ${qN+1} sur ${QTOT} : écoute bien !`);setTimeout(direQ,350);}
function dessinerOpts(){$("opts").innerHTML=qOpts.map(l=>`<div class="tileW" data-l="${l}" onclick="repondre('${l}',this)">${Lspan(l)}</div>`).join("");}
function direQ(){dire(qL);}
let qErr=false;
function repondre(l,el){if(qBloque||el.classList.contains("no"))return;
 if(l===qL){qBloque=true;qN++;if(!qErr){qOk++;streak++;}el.classList.add("ok");sOk();
  const b=qErr?"Voilà !":BRAVO[Math.floor(Math.random()*BRAVO.length)];
  lulu("hop",`${b} C'est ${aff(qL)} comme ${MOTS[qL][0]} ${MOTS[qL][1]}`+(!qErr&&streak>=3?` 🔥 ${streak} de suite !`:""));
  dire(b+" "+qL+", comme "+MOTS[qL][0]);majQ();setTimeout(()=>qN>=QTOT?finQuiz():question(),1900);}
 else{qErr=true;streak=0;el.classList.add("no");sNon();lulu("sad","Oups ! Écoute encore et essaie une autre lettre. 💪");majQ();setTimeout(direQ,700);}}
function finQuiz(){const s=qOk>=9?3:qOk>=6?2:1;sGagne();confettis();lulu("hop","Quiz terminé !");dire("Bravo ! Tu as "+qOk+" bonnes réponses sur "+QTOT+".");
 $("wstars").innerHTML="★".repeat(s)+"<i>"+"★".repeat(3-s)+"</i>";$("wtitle").textContent=s===3?"Champion !":"Bravo !";$("wtext").textContent=`Tu as ${qOk} bonnes réponses du premier coup sur ${QTOT}.`;$("win").style.display="flex";}
// ---------- MÉMORISER ----------
let mm=0,mCards=[],mOpen=[],mOk=0,mCoups=0,mLock=false;
function setMM(k){mm=k;[1,2,3].forEach(i=>$("mm"+i).classList.toggle("on",i-1===k));startMatch();}
function startMatch(){const ls=melange(ALPHA).slice(0,8);mCards=[];
 ls.forEach(l=>{mCards.push({l,t:"up"});mCards.push({l,t:mm===0?"up":mm===1?"low":"pic"});});
 mCards=melange(mCards);mOpen=[];mOk=0;mCoups=0;mLock=false;dessinerMatch();
 lulu("hop",mm===0?"Trouve les paires de lettres identiques !":mm===1?"Trouve la majuscule et sa minuscule !":"Trouve la lettre et son image !");}
function faceTxt(c){if(c.t==="pic")return `<span style="font-size:clamp(1.8rem,7vw,3.2rem)">${MOTS[c.l][1]}</span>`;return Lspan(c.l,c.t==="low"?c.l.toLowerCase():(mm===0?aff(c.l):c.l));}
function dessinerMatch(){$("mOk").textContent=mOk;$("mTot").textContent=8;$("mCoups").textContent=mCoups;
 $("mgrid").innerHTML=mCards.map((c,i)=>`<div class="card${c.m?" m":""}${mOpen.includes(i)?" f":""}" data-i="${i}" onclick="retourner(${i})"><div class="face back">⭐</div><div class="face front">${faceTxt(c)}</div></div>`).join("");}
function retourner(i){const c=mCards[i];if(mLock||c.m||mOpen.includes(i))return;mOpen.push(i);sFlip();
 document.querySelector(`.card[data-i="${i}"]`).classList.add("f");dire(c.t==="pic"?MOTS[c.l][0]:c.l);
 if(mOpen.length===2){mCoups++;$("mCoups").textContent=mCoups;mLock=true;const [a,b]=mOpen.map(k=>mCards[k]);
  setTimeout(()=>{if(a.l===b.l){a.m=b.m=true;mOk++;sOk();lulu("hop",`${BRAVO[Math.floor(Math.random()*BRAVO.length)]} ${aff(a.l)} comme ${MOTS[a.l][0]} ${MOTS[a.l][1]}`);
    mOpen.forEach(k=>document.querySelector(`.card[data-i="${k}"]`).classList.add("m"));mOpen=[];mLock=false;$("mOk").textContent=mOk;
    if(mOk===8)setTimeout(finMatch,700);}
   else{sNon();lulu("sad","Ce n'est pas une paire. Essaie encore !");mOpen.forEach(k=>document.querySelector(`.card[data-i="${k}"]`).classList.remove("f"));mOpen=[];setTimeout(()=>mLock=false,450);}},900);}}
function finMatch(){const s=mCoups<=12?3:mCoups<=18?2:1;sGagne();confettis();dire("Félicitations ! Tu as trouvé toutes les paires !");
 $("wstars").innerHTML="★".repeat(s)+"<i>"+"★".repeat(3-s)+"</i>";$("wtitle").textContent="Félicitations !";$("wtext").textContent=`Tu as trouvé les 8 paires en ${mCoups} coups.`;$("win").style.display="flex";}
function confettis(){const e=["⭐","🌟","🎉","💖","🎈","🌈","🍎","🌼"];for(let i=0;i<46;i++){const d=document.createElement("div");d.className="conf";d.textContent=e[i%e.length];d.style.left=Math.random()*100+"vw";d.style.animationDuration=2+Math.random()*1.8+"s";d.style.animationDelay=Math.random()*.7+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}
$("bx").textContent=minus?"✔":"";$("sonBtn").textContent=son?"🔊":"🔇";
dessinerLearn();
</script>
</body>
</html>
