<script>
const COUL=["#ff595e","#ff924c","#ffca3a","#8ac926","#52a675","#1982c4","#4267ac","#6a4c93","#f15bb5","#00bbf9"];
const ALPHA="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
const VOY="AEIOUY".split(""), CONS=ALPHA.filter(l=>!VOY.includes(l));
const NIV=[
 {n:1,sub:"Majuscules",f:l=>l},
 {n:2,sub:"Minuscules",f:l=>l.toLowerCase()},
 {n:3,sub:"Mélangées",f:l=>Math.random()<.5?l:l.toLowerCase()}
];
const MANCHES=3,PAR=8;
const BRAVO=["Bravo !","Super !","Génial !","Bien joué !","Oui !","Excellent !"];
const $=id=>document.getElementById(id);
const coul=l=>COUL[ALPHA.indexOf(l.toUpperCase())%COUL.length];
const Lsp=t=>`<span class="L" style="color:${coul(t)}">${t}</span>`;
const estV=t=>VOY.includes(t.toUpperCase());
function melange(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
let niv=0,manche=0,lettres=[],ranges=[],erreursNiv=0,son=true,sel=null;
let etoiles=[0,0,0];
try{etoiles=JSON.parse(localStorage.getItem("voy_etoiles"))||etoiles;son=localStorage.getItem("alpha_son")!=="0";}catch(e){}
// ---------- voix et sons ----------
let voixFR=null;
function chargerVoix(){try{const v=speechSynthesis.getVoices();voixFR=v.find(x=>/^fr(-|_)FR/i.test(x.lang))||v.find(x=>/^fr/i.test(x.lang))||null;}catch(e){}}
try{chargerVoix();speechSynthesis.onvoiceschanged=chargerVoix;}catch(e){}
function dire(t){if(!son)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="fr-FR";if(voixFR)u.voice=voixFR;u.rate=.85;u.pitch=1.15;speechSynthesis.speak(u);}catch(e){}}
function direVoyelles(){dire("Les voyelles : a, e, i, o, u, i grec.");lulu("hop","Les voyelles chantent : <b style='color:#c92a2a'>a, e, i, o, u, y</b> 🎵");}
let AC=null;
function bip(notes,type="sine",dur=.12){if(!son)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime;
 notes.forEach(f=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.22,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.02);t+=dur*.8;});}catch(e){}}
const sPrend=()=>bip([520],"sine",.07),sOk=()=>bip([660,880,1175],"triangle",.11),sNon=()=>bip([300,220],"sawtooth",.15),sGagne=()=>bip([523,659,784,1047,784,1047],"triangle",.14);
function toggleSon(){son=!son;try{localStorage.setItem("alpha_son",son?"1":"0")}catch(e){}$("sonBtn").textContent=son?"🔊":"🔇";if(!son)speechSynthesis.cancel();}
// ---------- chouette ----------
document.querySelectorAll(".owlSlot").forEach(s=>s.replaceWith($("owlTpl").content.cloneNode(true)));
setInterval(()=>document.querySelectorAll(".owl").forEach(o=>{o.classList.add("blink");setTimeout(()=>o.classList.remove("blink"),160);}),3200);
function lulu(cls,txt){document.querySelectorAll(".owl").forEach(o=>{o.classList.remove("hop","sad");void o.offsetWidth;if(cls)o.classList.add(cls);});if(txt!==undefined)$("bubble").innerHTML=txt;}
$("titre").innerHTML=[..."a e i o u y"].map((c,i)=>c===" "?"&nbsp;":`<span style="color:#ff595e;animation-delay:${i*.12}s">${c}</span>`).join("")+
 `<div style="font-size:.5em;color:#ffe9a8;margin-top:4px">Voyelles et consonnes</div>`;
// ---------- niveaux ----------
function boutons(){$("levels").innerHTML=NIV.map((v,i)=>`<button class="lv ${i===niv?"on":""}" onclick="choisir(${i})">Niveau ${v.n} <span class="st">${"★".repeat(etoiles[i])}<i>${"★".repeat(3-etoiles[i])}</i></span><small>${v.sub}</small></button>`).join("");}
function choisir(i){niv=i;debutNiveau();}
function debutNiveau(){manche=0;erreursNiv=0;boutons();nouvelleManche();}
function nouvelleManche(){
 // 3 voyelles et 5 consonnes, toutes différentes
 const v=melange(VOY).slice(0,3),c=melange(CONS).slice(0,5);
 lettres=melange([...v,...c]).map(l=>NIV[niv].f(l));ranges=[];sel=null;
 $("sRound").textContent=manche+1;$("sTot").textContent=PAR;$("inV").innerHTML="";$("inC").innerHTML="";
 dessiner();
 lulu("hop",manche===0?"Les voyelles chantent : <b style='color:#c92a2a'>a, e, i, o, u, y</b>. Range chaque lettre dans le bon panier !":`Manche ${manche+1} : range les lettres !`);
 dire(manche===0?"Range chaque lettre dans le bon panier : voyelles ou consonnes.":"Manche "+(manche+1)+".");
}
function dessiner(){
 $("tray").innerHTML=lettres.map((t,i)=>ranges.includes(i)?"":`<div class="bub${sel===i?" sel":""}" data-i="${i}">${Lsp(t)}</div>`).join("");
 $("sOk").textContent=ranges.length;
}
// ---------- glisser-déposer + toucher ----------
let drag=null,depart=null,bouge=false,source=null;
document.addEventListener("pointerdown",e=>{
 const b=e.target.closest(".bub");const k=e.target.closest(".basket");
 if(b){depart={x:e.clientX,y:e.clientY};source={i:+b.dataset.i,el:b};bouge=false;e.preventDefault();return;}
 if(k&&sel!==null&&!e.target.closest(".say")){essayer(sel,k.dataset.k,null);sel=null;dessiner();}
});
document.addEventListener("pointermove",e=>{
 if(!source)return;
 if(!bouge&&Math.hypot(e.clientX-depart.x,e.clientY-depart.y)>8){bouge=true;sPrend();dire(lettres[source.i]);
  drag=document.createElement("div");drag.className="bub drag";drag.innerHTML=Lsp(lettres[source.i]);document.body.appendChild(drag);source.el.style.visibility="hidden";}
 if(bouge){const w=drag.offsetWidth;drag.style.left=e.clientX-w/2+"px";drag.style.top=e.clientY-w/2+"px";
  document.querySelectorAll(".basket.hover").forEach(x=>x.classList.remove("hover"));const c=sous(e);if(c)c.classList.add("hover");}
});
document.addEventListener("pointerup",e=>{
 if(!source)return;
 if(bouge){const c=sous(e);drag.remove();drag=null;document.querySelectorAll(".basket.hover").forEach(x=>x.classList.remove("hover"));
  if(c)essayer(source.i,c.dataset.k,source.el);else source.el.style.visibility="";}
 else{sel=sel===source.i?null:source.i;sPrend();dire(lettres[source.i]);if(sel!==null)lulu(null,`${Lsp(lettres[source.i])} : voyelle ou consonne ? Touche le bon panier.`);dessiner();}
 source=null;
});
function sous(e){const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest(".basket");}
function essayer(i,k,el){
 const t=lettres[i],bon=estV(t)?"v":"c";
 if(k===bon){ranges.push(i);sOk();$(k==="v"?"inV":"inC").insertAdjacentHTML("beforeend",Lsp(t));dessiner();
  const b=BRAVO[Math.floor(Math.random()*BRAVO.length)];
  lulu("hop",`${b} ${Lsp(t)} est une <b style="color:${k==="v"?"#c92a2a":"#364fc7"}">${k==="v"?"voyelle":"consonne"}</b>.`);
  dire(b+" "+t+" est une "+(k==="v"?"voyelle":"consonne")+".");
  if(ranges.length===lettres.length)setTimeout(finManche,1800);}
 else{erreursNiv++;sNon();
  const bk=document.querySelector(`.basket[data-k="${k}"]`);bk.classList.remove("bad");void bk.offsetWidth;bk.classList.add("bad");
  if(el){el.style.visibility="";el.classList.remove("back");void el.offsetWidth;el.classList.add("back");}
  const m=bon==="v"?`Oups ! ${Lsp(t)} est une voyelle : elle chante ! Essaie encore. 💪`:`Oups ! ${Lsp(t)} n'est pas une voyelle. Les voyelles sont a, e, i, o, u, y. Essaie encore ! 💪`;
  lulu("sad",m);dire(bon==="v"?"Oups ! "+t+" est une voyelle. Essaie encore.":"Oups ! Ce n'est pas une voyelle. Essaie encore.");}
}
function finManche(){
 manche++;
 if(manche<MANCHES){confettis(18);sGagne();lulu("hop","Manche réussie ! On continue… 🌟");dire("Manche réussie !");setTimeout(nouvelleManche,2400);return;}
 const s=erreursNiv===0?3:erreursNiv<=3?2:1;etoiles[niv]=Math.max(etoiles[niv],s);try{localStorage.setItem("voy_etoiles",JSON.stringify(etoiles))}catch(e){}
 confettis(46);sGagne();dire("Bravo ! Tu as réussi le niveau "+NIV[niv].n+" !");boutons();
 setTimeout(()=>{$("wstars").innerHTML="★".repeat(s)+"<i>"+"★".repeat(3-s)+"</i>";$("wtitle").textContent=s===3?"Parfait !":"Bravo !";
  $("wtext").textContent=erreursNiv?`Niveau ${NIV[niv].n} réussi ! Tu as corrigé ${erreursNiv} erreur${erreursNiv>1?"s":""}.`:`Niveau ${NIV[niv].n} réussi sans aucune erreur ! 🏆`;
  $("wnext").textContent=niv<NIV.length-1?"Niveau suivant ➜":"Recommencer ➜";$("win").style.display="flex";lulu("hop");},1200);
}
function suite(){$("win").style.display="none";niv=niv<NIV.length-1?niv+1:0;debutNiveau();}
function confettis(n){const e=["⭐","🌟","🎉","💖","🎈","🌈","🍎","🌼"];for(let i=0;i<n;i++){const d=document.createElement("div");d.className="conf";d.textContent=e[i%e.length];d.style.left=Math.random()*100+"vw";d.style.animationDuration=2+Math.random()*1.8+"s";d.style.animationDelay=Math.random()*.7+"s";document.body.appendChild(d);setTimeout(()=>d.remove(),5000);}}
$("sonBtn").textContent=son?"🔊":"🔇";
debutNiveau();
</script>
</body>
</html>
