<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wasteland Detective</title>
<style>
:root{--ink:#1d2330;--line:#d8dde6;--acc:#1f6f78;--bg:#f6f4ef;--ok:#1e7d3a;--bad:#b3261e}
*{box-sizing:border-box}
html{font-size:var(--fs,18px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Verdana,"Segoe UI",Arial,sans-serif;line-height:1.5;-webkit-user-select:none;user-select:none}
.wrap{max-width:1200px;margin:0 auto;padding:14px}
header{background:var(--acc);color:#fff;border-radius:12px;padding:12px 16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{margin:0;font-size:1.3rem;flex:1}header small{display:block;font-size:.72rem;opacity:.9}
.hb{border:none;background:#fff;color:var(--acc);border-radius:8px;padding:6px 10px;font:inherit;font-size:.85rem;cursor:pointer;font-weight:bold}
.tabs{display:flex;gap:6px;margin:12px 0;flex-wrap:wrap}
.tab{flex:1;min-width:120px;border:2px solid var(--line);background:#fff;border-radius:10px;padding:8px;font:inherit;font-size:.85rem;cursor:pointer;text-align:center}
.tab.on{border-color:var(--acc);background:#e6f2f3;font-weight:bold}
.tab .sc{display:block;font-size:.75rem;color:#5b6474}
.page{display:none}.page.on{display:block}
.pic{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center}
.pic .in{position:relative;display:inline-block;max-width:100%}
.pic img{max-width:100%;max-height:max(220px,min(40vh,calc(100vh - 800px)));display:block;border-radius:8px}
.pic.big img{max-height:80vh}
.mk{position:absolute;transform:translate(-50%,-50%);width:2.4rem;height:2.4rem;border-radius:50%;background:#fff;border:3px solid #111;font-weight:bold;font-size:1.3rem;display:flex;align-items:center;justify-content:center}
.task{background:#fffbe6;border:1px solid #ecd97a;border-radius:9px;padding:6px 12px;margin:8px 0;font-size:.95rem;display:flex;gap:8px;align-items:center}
.bank{background:#fff;border:2px dashed #b0b8c4;border-radius:12px;padding:10px;min-height:70px;display:flex;flex-wrap:wrap;gap:8px}
.bank.empty::after{content:"All sentences are placed. Tap ✔ Check.";color:#5b6474;font-size:.9rem;padding:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:2px solid #9aa3b2;border-radius:10px;padding:9px 10px;font-size:.92rem;cursor:grab;touch-action:none;box-shadow:0 2px 0 #0001;max-width:100%}
.chip.sel{border-color:#ffb300;box-shadow:0 0 0 3px #ffd54a}
.chip.ok{border-color:var(--ok);background:#e6f4ea}.chip.ko{border-color:var(--bad);background:#fbe9e7}
.chip .spk{border:none;background:none;font-size:1rem;cursor:pointer;padding:0 2px}
.chip.drag{position:fixed;z-index:999;pointer-events:none;opacity:.92;transform:rotate(-2deg)}
.zones{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:10px;margin-top:10px}
@media(max-width:1000px){.zones{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.zones{grid-template-columns:1fr}}
.zone{background:#fff;border:3px solid var(--zc);border-radius:12px;min-height:110px;display:flex;flex-direction:column}
.zone h3{margin:0;background:var(--zc);color:#fff;padding:8px 10px;font-size:1rem;display:flex;align-items:center;gap:8px;border-radius:8px 8px 0 0}
.zone h3 .let{background:#fff;color:#111;border-radius:50%;width:1.7rem;height:1.7rem;display:inline-flex;align-items:center;justify-content:center;font-weight:bold}
.zone .drop{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.zone.hover{box-shadow:0 0 0 4px #ffd54a}
.zone .hint{color:#8a93a3;font-size:.8rem;text-align:center;margin:auto}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.act{font:inherit;font-size:.9rem;padding:10px 14px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer}
.act.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold}
.result{display:none;background:#fff;border:3px solid var(--acc);border-radius:12px;padding:12px 14px;font-size:1.05rem;margin-top:8px}
.result b.big{font-size:1.5rem;color:var(--acc)}
.final{background:#fff;border:3px solid var(--acc);border-radius:12px;padding:18px;text-align:center}
.final table{margin:12px auto;border-collapse:collapse;font-size:1rem}
.final td,.final th{border:1px solid var(--line);padding:8px 14px}
.def{background:#e6f2f3;border-left:6px solid var(--acc);border-radius:9px;padding:7px 12px;margin:8px 0;font-size:.95rem}
.wbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px}
.wrow{display:flex;align-items:center;gap:10px;margin:10px 0}
.wrow .n{font-weight:bold;color:var(--acc);width:1.6rem}
.wrow .st{white-space:nowrap;font-weight:bold}
@media(max-width:700px){.wrow{flex-wrap:wrap}.wrow input{min-width:60%}}
.wrow input{flex:1;font:inherit;font-size:1rem;border:none;border-bottom:3px solid #9aa3b2;padding:8px 4px;background:transparent;outline:none;-webkit-user-select:text;user-select:text}
.wrow input:focus{border-bottom-color:var(--acc)}
.wrow .fb{width:2rem;font-size:1.3rem;text-align:center}
.wrow input.ok{border-bottom-color:var(--ok)}.wrow input.ko{border-bottom-color:var(--bad)}
.ideas{display:none;background:#fffbe6;border:1px solid #ecd97a;border-radius:9px;padding:8px 12px;margin-top:8px;font-size:.9rem}
.ideas.on{display:block}
.sub{font-weight:bold;margin:14px 0 2px}
.name{margin:10px 0;display:flex;gap:8px;align-items:center}
.name input{font:inherit;padding:6px 10px;border:2px solid var(--line);border-radius:8px;-webkit-user-select:text;user-select:text}
@media print{.tabs,.bar,header .hb,.hg-back,.name{display:none!important}.page:not(.on){display:none!important}body{background:#fff}}
</style>
<style>@media print{.hg-back{display:none!important}}
.hg-back{position:fixed;top:14px;left:14px;z-index:99999;display:flex;align-items:center;gap:8px;background:#fff;color:#FF6B9D;padding:12px 26px;border-radius:40px;font:800 20px "Arial Rounded MT Bold","Helvetica Rounded",Arial,sans-serif;text-decoration:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.hg-back:hover{background:linear-gradient(135deg,#FF6B9D,#C06C84);color:#fff}
body{padding-top:80px!important}
@media(min-width:1300px){body{padding-top:0!important;margin-top:0!important}body>*:first-of-type,header,.wrap,.app,.container{margin-top:0!important}}
@media(max-width:600px){.hg-back{top:8px;left:8px;padding:8px 16px;font-size:15px}body{padding-top:60px!important}}</style>
</head>

function build(){
 document.getElementById("tabs").innerHTML=PAGES.map((p,i)=>`<button class="tab" data-p="${i}">Page ${i+1}<span class="sc" id="tsc${i}">${p.title}</span></button>`).join("")+`<button class="tab" data-p="${PAGES.length}">Page ${PAGES.length+1} ✏️<span class="sc" id="tscW">${W.title}</span></button><button class="tab" data-p="${NP}">🏆 Results<span class="sc">Total marks</span></button>`;
 document.getElementById("tabs").onclick=e=>{const t=e.target.closest(".tab");if(t)go(+t.dataset.p);};
 document.getElementById("pages").innerHTML=PAGES.map((p,i)=>`
 <section class="page" id="pg${i}">
  <div class="def">${p.def}</div>
  <div class="pic" title="Tap the picture to make it bigger or smaller" onclick="this.classList.toggle('big')"><div class="in"><img src="${IMG}" alt="Wasteland">${(p.marks||[]).map(m=>`<span class="mk" style="left:${m[1]}%;top:${m[2]}%">${m[0]}</span>`).join("")}</div><div style="font-size:.75rem;color:#5b6474">🔍 Tap the picture to zoom</div></div>
  <div class="task">👉 <span>${p.task}</span> <button class="hb" style="margin-left:auto;border:1px solid #ecd97a" onclick="speak(PAGES[${i}].task.replace(/<[^>]+>/g,'')+' The boxes are: '+PAGES[${i}].zones.map(z=>z[0]+', '+z[1]).join('. '))">🔊</button></div>
  <div class="bank" id="bank${i}"></div>
  <div class="zones" style="--n:${p.zones.length}">${p.zones.map(([L,t,ic,col])=>`<div class="zone" data-z="${L}" style="--zc:${col}"><h3><span class="let">${L}</span>${ic} ${t}</h3><div class="drop" id="z${i}${L}"><span class="hint">Drop sentences here</span></div></div>`).join("")}</div>
  <div class="result" id="res${i}"></div>
  <div class="bar">
   <button class="act primary" onclick="check(${i})">✔ Check</button>
   <button class="act" onclick="showAns(${i})">👁 Show answers</button>
   <button class="act" onclick="resetPage(${i})">↻ Try again</button>
   ${i>0?`<button class="act" onclick="go(${i-1})">← Back</button>`:""}
   <button class="act" onclick="go(${i+1})">Next →</button>
  </div>
 </section>`).join("")+`<section class="page" id="pg${PAGES.length}">
  <div class="def">✏️ <b>Your turn!</b> Look at the wasteland. Write <b>two different ways</b> to solve the problem. Then write what this land could become.</div>
  <div class="pic" onclick="this.classList.toggle('big')"><div class="in"><img src="${IMG}" alt="Wasteland" style="max-height:max(200px,min(30vh,calc(100vh - 820px)))"></div><div style="font-size:.75rem;color:#5b6474">🔍 Tap the picture to zoom</div></div>
  <div class="wbox">
   <div class="sub">How can we solve the problem? (2 marks)</div>
   ${[0,1].map(j=>`<div class="wrow"><span class="n">${j+1}.</span><span class="st">${W.lines[j].start}</span><input id="w${j}" placeholder="…" autocomplete="off"><span class="fb" id="f${j}"></span></div>`).join("")}
   <div class="sub">What could this land become? (1 mark)</div>
   <div class="wrow"><span class="n">3.</span><span class="st">${W.lines[2].start}</span><input id="w2" placeholder="…" autocomplete="off"><span class="fb" id="f2"></span></div>
   <div style="font-size:.85rem;color:#5b6474">Finish each sentence. Remember the <b>full stop</b> at the end.</div>
   <div class="ideas" id="ideas">💡 <b>Ways to solve:</b> ${W.ideas}<br>🏗️ <b>The land could become:</b> ${W.ideas2}</div>
   <div class="ideas" id="poss">👁 <b>Possible answers:</b><br>${W.answers.map((a,j)=>`${j+1}. ${a}`).join("<br>")}</div>
  </div>
  <div class="result" id="resW"></div>
  <div class="bar">
   <button class="act primary" onclick="checkW()">✔ Check</button>
   <button class="act" onclick="document.getElementById('ideas').classList.toggle('on')">💡 Help me</button>
   <button class="act" onclick="document.getElementById('poss').classList.toggle('on')">👁 Possible answers</button>
   <button class="act" onclick="resetW()">↻ Try again</button>
   <button class="act" onclick="go(${PAGES.length-1})">← Back</button>
   <button class="act" onclick="go(${NP})">Next →</button>
  </div></section><section class="page" id="pg${NP}"><div class="final" id="final"></div></section>`;

 PAGES.forEach((p,i)=>resetPage(i,true));
}
function chipHTML(pi,k){const t=PAGES[pi].ev[k][0];return `<span class="chip" data-p="${pi}" data-k="${k}"><span>${esc(t)}</span><button class="spk" data-say="${esc(t)}" title="Read">🔊</button></span>`;}
function resetPage(pi,silent){
 const s=state[pi]; s.place={}; s.checked=false; s.score=null;
 const b=document.getElementById("bank"+pi); b.innerHTML=shuffle(PAGES[pi].ev.map((_,k)=>k)).map(k=>chipHTML(pi,k)).join(""); b.classList.remove("empty");
 PAGES[pi].zones.forEach(([L])=>document.getElementById(`z${pi}${L}`).innerHTML='<span class="hint">Drop sentences here</span>');
 document.getElementById("res"+pi).style.display="none"; updateTab(pi);
}
function placeChip(chip,zoneL){
 const pi=+chip.dataset.p,k=+chip.dataset.k,s=state[pi]; if(s.checked) return;
 const target = zoneL ? document.getElementById(`z${pi}${zoneL}`) : document.getElementById("bank"+pi);
 const h=target.querySelector(".hint"); if(h) h.remove();
 target.appendChild(chip); chip.classList.remove("sel","ok","ko");
 if(zoneL) s.place[k]=zoneL; else delete s.place[k];
 PAGES[pi].zones.forEach(([L])=>{const z=document.getElementById(`z${pi}${L}`); if(!z.querySelector(".chip")&&!z.querySelector(".hint")) z.innerHTML='<span class="hint">Drop sentences here</span>';});
 document.getElementById("bank"+pi).classList.toggle("empty",!document.getElementById("bank"+pi).querySelector(".chip"));
}
/* drag with pointer events (mouse + touch) and tap-to-place */
let drag=null, selChip=null;
document.addEventListener("pointerdown",e=>{
 const sp=e.target.closest(".spk"); if(sp){speak(sp.dataset.say);e.preventDefault();return;}
 const c=e.target.closest(".chip"); if(!c||c.classList.contains("drag")) return;
 if(state[+c.dataset.p].checked) return;
 drag={chip:c,x:e.clientX,y:e.clientY,ghost:null,moved:false};
});
document.addEventListener("pointermove",e=>{
 if(!drag) return;
 if(!drag.moved && Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8) return;
 if(!drag.moved){drag.moved=true;const r=drag.chip.getBoundingClientRect();drag.ox=e.clientX-r.left;drag.oy=e.clientY-r.top;drag.ghost=drag.chip.cloneNode(true);drag.ghost.classList.add("drag");drag.ghost.style.width=r.width+"px";document.body.appendChild(drag.ghost);drag.chip.style.opacity=.35;}
 drag.ghost.style.left=(e.clientX-drag.ox)+"px";drag.ghost.style.top=(e.clientY-drag.oy)+"px";
 document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hover"));
 const el=document.elementFromPoint(e.clientX,e.clientY); const z=el&&el.closest(".zone"); if(z) z.classList.add("hover");
 const m=60; if(e.clientY>innerHeight-m) scrollBy(0,18); else if(e.clientY<m) scrollBy(0,-18);
 e.preventDefault();
},{passive:false});
document.addEventListener("pointerup",e=>{
 if(!drag) return; const d=drag; drag=null;
 document.querySelectorAll(".zone").forEach(z=>z.classList.remove("hover"));
 if(d.moved){
  d.ghost.remove(); d.chip.style.opacity="";
  const el=document.elementFromPoint(e.clientX,e.clientY); const z=el&&el.closest(".zone"); const bk=el&&el.closest(".bank");
  if(z && z.closest("#pg"+d.chip.dataset.p)) placeChip(d.chip,z.dataset.z); else if(bk) placeChip(d.chip,null);
  if(selChip){selChip.classList.remove("sel");selChip=null;}
 } else {
  if(selChip===d.chip){d.chip.classList.remove("sel");selChip=null;}
  else{ if(selChip) selChip.classList.remove("sel"); selChip=d.chip; d.chip.classList.add("sel"); }
 }
});
document.addEventListener("click",e=>{
 if(!selChip) return; if(e.target.closest(".chip")) return;
 const z=e.target.closest(".zone"), bk=e.target.closest(".bank");
 if(z && z.closest("#pg"+selChip.dataset.p)){placeChip(selChip,z.dataset.z);selChip=null;}
 else if(bk){placeChip(selChip,null);selChip=null;}
});
function check(pi){
 const p=PAGES[pi],s=state[pi]; const placed=Object.keys(s.place).length;
 if(placed<p.ev.length && !confirm(`You placed ${placed} of ${p.ev.length} sentences. Check anyway?`)) return;
 s.checked=true; let sc=0;
 document.querySelectorAll(`#pg${pi} .chip`).forEach(c=>{const k=+c.dataset.k; const ok=s.place[k]===p.ev[k][1]; if(ok)sc++; if(s.place[k]) c.classList.add(ok?"ok":"ko");});
 s.score=sc; updateTab(pi);
 const msg=sc===p.ev.length?"Excellent! 🌟":sc>=p.ev.length/2?"Good try! Look at the red sentences.":"Keep trying! Look at the picture again.";
 const r=document.getElementById("res"+pi);
 r.innerHTML=`Marks: <b class="big">${sc} / ${p.ev.length}</b> &nbsp; ${msg}<br><span style="font-size:.85rem">Green = correct · Red = wrong place</span>`;
 r.style.display="block"; speak(`You scored ${sc} out of ${p.ev.length}.`);
}
function showAns(pi){
 const p=PAGES[pi],s=state[pi]; if(!s.checked){s.checked=true;s.score=0;updateTab(pi);}
 document.querySelectorAll(`#pg${pi} .chip`).forEach(c=>{const k=+c.dataset.k;const was=s.place[k];const z=document.getElementById(`z${pi}${p.ev[k][1]}`);const h=z.querySelector(".hint");if(h)h.remove();z.appendChild(c);c.classList.remove("sel");c.classList.add(was===p.ev[k][1]?"ok":"ko");});
 document.getElementById("bank"+pi).classList.add("empty");
}
function updateTab(pi){const s=state[pi],el=document.getElementById("tsc"+pi);el.textContent=s.score===null?PAGES[pi].title:`✔ ${s.score} / ${PAGES[pi].ev.length}`;}
function go(i){
 if(i>NP) i=NP; cur=i;
 document.querySelectorAll(".page").forEach((p,k)=>p.classList.toggle("on",k===i));
 document.querySelectorAll(".tab").forEach((t,k)=>t.classList.toggle("on",k===i));
 if(i===NP) finalPage();
 window.scrollTo({top:0,behavior:"smooth"});
}
function norm(s){return s.toLowerCase().replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();}
function checkW(){
 let sc=0; const tips=[]; const got=[];
 W.lines.forEach((L,j)=>{
  const el=document.getElementById("w"+j), fb=document.getElementById("f"+j);
  let v=el.value.trim(); let body=norm(v); const st=norm(L.start); while(st&&body.startsWith(st)) body=body.slice(st.length).trim();
  let ok=body.split(" ").filter(Boolean).length>=2 && L.kw.some(k=>body.includes(k));
  if(ok && j===1 && got[0] && norm(document.getElementById("w0").value)===body){ok=false;tips.push("Sentence 2 must give a different idea.");}
  got[j]=ok; if(ok) sc++;
  el.classList.toggle("ok",ok); el.classList.toggle("ko",!ok&&v.length>0); fb.textContent=v?(ok?"✅":"❌"):"";
  if(ok && v && !/[.!]$/.test(v)) tips.push(`Sentence ${j+1}: remember the full stop.`);
 });
 wscore=sc; document.getElementById("tscW").textContent=`✔ ${sc} / 3`;
 const r=document.getElementById("resW");
 r.innerHTML=`Marks: <b class="big">${sc} / 3</b> &nbsp; ${sc===3?"Excellent! 🌟":sc>=2?"Good work!":"Keep trying! Tap 💡 Help me."}${tips.length?"<br><span style='font-size:.85rem'>"+tips.join("<br>")+"</span>":""}`;
 r.style.display="block"; speak(`You scored ${sc} out of 3.`);
}
function resetW(){[0,1,2].forEach(j=>{const el=document.getElementById("w"+j);el.value="";el.className="";document.getElementById("f"+j).textContent="";});wscore=null;document.getElementById("tscW").textContent=W.title;document.getElementById("resW").style.display="none";}
function finalPage(){
 const tot=PAGES.reduce((a,p)=>a+p.ev.length,0)+3, sc=state.reduce((a,s)=>a+(s.score||0),0)+(wscore||0);
 const nm=document.getElementById("pname").value.trim();
 const msg=sc>=tot*.75?"Well done, wasteland detective! 🌟":sc>=tot/2?"Good work! Try the pages again to get more marks.":"Keep practising! Go back and try again.";
 const sent=[0,1,2].map(j=>{const v=document.getElementById("w"+j).value.trim();return v?W.lines[j].start+v:"";}).filter(Boolean);
 document.getElementById("final").innerHTML=`<h2 style="margin:0">🏆 Total marks</h2>${nm?`<div style="font-size:1.1rem">${esc(nm)}</div>`:""}<div style="font-size:2.4rem;font-weight:bold;color:var(--acc)">${sc} / ${tot}</div><p>${msg}</p>
 <table><tr><th>Page</th><th>Marks</th></tr>${PAGES.map((p,i)=>`<tr><td>${i+1}. ${esc(p.title)}</td><td>${state[i].score===null?"not checked":state[i].score+" / "+p.ev.length}</td></tr>`).join("")}<tr><td>${PAGES.length+1}. ${W.title}</td><td>${wscore===null?"not checked":wscore+" / 3"}</td></tr></table>
 ${sent.length?`<div style="text-align:left;max-width:700px;margin:10px auto"><b>My sentences:</b><ol>${sent.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></div>`:""}
 <button class="act primary" onclick="restartAll()">↻ Restart all pages</button> <button class="act" onclick="window.print()">🖨 Print</button>`;
 speak(`Your total is ${sc} out of ${tot}.`);
}
function restartAll(){PAGES.forEach((p,i)=>resetPage(i));resetW();go(0);}
document.getElementById("help").onclick=()=>speak("A wasteland is a plot of land that was used before, but now it is abandoned and neglected. On pages 1, 2 and 3, drag each sentence to the correct box, then tap Check. On page 4, write your own sentences.");
let FS=18;try{FS=+localStorage.getItem("hg_fs")||18}catch(e){}
function setFS(v){FS=Math.max(15,Math.min(28,v));document.documentElement.style.setProperty("--fs",FS+"px");try{localStorage.setItem("hg_fs",FS)}catch(e){}}
setFS(FS);document.getElementById("fsUp").onclick=()=>setFS(FS+2);document.getElementById("fsDown").onclick=()=>setFS(FS-2);
build(); go(0);
</script>
</body>
</html>
