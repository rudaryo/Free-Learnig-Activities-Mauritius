<style>
:root{--ink:#1d2330;--line:#d8dde6;--acc:#1f6f78;--bg:#f6f4ef}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Verdana,"Segoe UI",Arial,sans-serif;font-size:17px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:16px}
header{background:var(--acc);color:#fff;border-radius:12px;padding:14px 18px;margin-bottom:12px;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
header h1{margin:0;font-size:24px;flex:1}
header small{display:block;font-size:13px;opacity:.9}
.say{border:none;background:#fff;border-radius:50%;width:38px;height:38px;font-size:20px;cursor:pointer}
.layout{display:grid;grid-template-columns:270px 1fr;gap:14px}
@media(max-width:860px){.layout{grid-template-columns:1fr}}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.panel h2{font-size:17px;margin:0 0 8px}
.key{display:flex;flex-direction:column;gap:8px}
@media(max-width:860px){.key{flex-direction:row;flex-wrap:wrap}.key .kbtn{flex:1 1 150px}}
.kbtn{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;cursor:pointer;font:inherit;text-align:left}
.kbtn .sw{width:30px;height:30px;border-radius:6px;border:2px solid #0003;flex:none}
.kbtn b{display:block;font-size:15px}.kbtn span.m{font-size:12.5px;color:#5b6474}
.kbtn.sel{border-color:#000;box-shadow:0 0 0 3px #ffd54a}
.kbtn .ks{margin-left:auto;font-size:16px;opacity:.7}
.stage{position:relative;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px}
.stage svg{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation}
.region{fill:transparent;cursor:pointer;stroke:transparent;stroke-width:4}
.region:hover{stroke:#fff;stroke-dasharray:10 6}
.badge circle{stroke:#000;stroke-width:4}
.badge text{font-weight:bold;font-size:40px;pointer-events:none}
.mark{font-size:46px;font-weight:bold;pointer-events:none}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
button.act{font:inherit;font-size:15px;padding:10px 14px;border-radius:9px;border:2px solid var(--line);background:#fff;cursor:pointer}
button.act.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:bold}
.status{background:#fffbe6;border:1px solid #ecd97a;border-radius:9px;padding:10px 12px;font-size:16px}
.result{display:none;background:#fff;border:3px solid var(--acc);border-radius:12px;padding:14px;margin-top:12px;font-size:18px}
.result b.big{font-size:26px;color:var(--acc)}
table{border-collapse:collapse;width:100%;margin-top:12px;background:#fff;font-size:15px}
th,td{border:1px solid var(--line);padding:7px 9px;text-align:left}
th{background:#eef1f5}
td.sw{width:26px}
.ok{color:#1e7d3a;font-weight:bold}.no{color:#b3261e;font-weight:bold}
@media print{.bar,.say,header .say{display:none}body{background:#fff}}
</style>

   </svg>
  </div>
  <div class="bar">
   <button class="act primary" id="btnCheck">✔ Check my answers</button>
   <button class="act" id="btnShow">👁 Show correct answers</button>
   <button class="act" id="btnRestart">↻ Restart</button>
   <button class="act" id="btnPrint">🖨 Print</button>
  </div>
  <div class="result" id="result"></div>
  <table id="tbl"><tr><th>No.</th><th>What I see</th><th></th><th>My land use</th><th id="thMark"></th></tr></table>
 </div>
</div>
</div>

<script>
const TYPES = [
 {id:"res", name:"Residential", meaning:"where people live", color:"#ffd43b", icon:"🏠"},
 {id:"agr", name:"Agricultural", meaning:"farming: crops and animals", color:"#2fb344", icon:"🌱"},
 {id:"com", name:"Commercial", meaning:"shops: buying and selling", color:"#e03131", icon:"🛒"},
 {id:"ind", name:"Industrial", meaning:"factories: making things", color:"#9c36b5", icon:"🏭"},
 {id:"rec", name:"Recreational", meaning:"fun and leisure: hotels, parks", color:"#228be6", icon:"🏖️"},
 {id:"inf", name:"Infrastructural", meaning:"roads and motorways", color:"#343a40", icon:"🛣️"},
 {id:"was", name:"Wasteland", meaning:"land left alone, not cared for", color:"#a0522d", icon:"🚯"}
];
const PLACES = [
 {n:1, see:"Sugar cane field", ans:"agr", badge:[248,155], polys:["0,95 570,100 578,245 0,258"]},
 {n:2, see:"Houses", ans:"res", badge:[270,312], polys:["25,280 232,280 232,398 25,398","298,262 486,262 486,346 298,346","62,424 182,424 182,518 62,518","598,280 822,280 822,342 598,342","815,334 972,334 972,432 815,432"]},
 {n:3, see:"Bakery, supermarket and shops", ans:"com", badge:[498,395], polys:["224,346 822,346 822,516 224,516"]},
 {n:4, see:"Factory", ans:"ind", badge:[757,160], polys:["600,60 988,60 988,250 600,250"]},
 {n:5, see:"Hotel by the beach", ans:"rec", badge:[1290,215], polys:["1005,108 1292,108 1292,318 1005,318"]},
 {n:6, see:"Road", ans:"inf", badge:[877,516], polys:["0,610 300,600 600,588 900,555 1100,512 1240,470 1300,420 1295,380 1240,345 1130,315 1000,292 880,268 720,255 620,248 620,262 720,275 870,300 950,330 1030,360 1110,390 1150,425 1100,455 900,490 600,515 300,537 0,560"]},
 {n:7, see:"Farm: crops and animals", ans:"agr", badge:[460,858], polys:["0,612 340,572 420,680 870,700 886,880 860,1000 600,1024 0,1024"]},
 {n:8, see:"Park", ans:"rec", badge:[1103,893], polys:["900,690 1536,660 1536,1000 1300,1024 940,1004 900,820"]},
 {n:9, see:"Abandoned plot (wasteland)", ans:"was", badge:[1137,560], polys:["720,575 1100,518 1520,555 1500,640 1060,668 720,605"]}
];
const NS="http://www.w3.org/2000/svg";
let sel=null, chosen={}, checked=false;

function speak(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";u.rate=.85;speechSynthesis.speak(u);}catch(e){}}
const typeById=id=>TYPES.find(t=>t.id===id);

function buildKey(){
 const k=document.getElementById("key");
 k.innerHTML=TYPES.map(t=>`<button class="kbtn" data-id="${t.id}"><span class="sw" style="background:${t.color}"></span><span><b>${t.icon} ${t.name}</b><span class="m">${t.meaning}</span></span><span class="ks" data-say="${t.id}" title="Read aloud">🔊</span></button>`).join("");
 k.onclick=e=>{
  const s=e.target.closest(".ks"); if(s){const t=typeById(s.dataset.say);speak(t.name+". "+t.meaning);return;}
  const b=e.target.closest(".kbtn"); if(!b) return;
  sel=b.dataset.id; k.querySelectorAll(".kbtn").forEach(x=>x.classList.toggle("sel",x===b));
  const t=typeById(sel);
  setStatus(`You chose <b style="color:${t.color}">${t.icon} ${t.name}</b>. Now tap a place on the picture.`);
  speak(t.name);
 };
}
function setStatus(h){document.getElementById("status").innerHTML=h;}

function buildPic(){
 const hits=document.getElementById("hits"), badges=document.getElementById("badges");
 PLACES.forEach(p=>{
  p.polys.forEach(pts=>{const el=document.createElementNS(NS,"polygon");el.setAttribute("points",pts);el.setAttribute("class","region");el.dataset.n=p.n;hits.appendChild(el);});
  const g=document.createElementNS(NS,"g");g.setAttribute("class","badge");g.dataset.n=p.n;g.style.cursor="pointer";
  g.innerHTML=`<circle cx="${p.badge[0]}" cy="${p.badge[1]}" r="34" fill="#fff"/><text x="${p.badge[0]}" y="${p.badge[1]+14}" text-anchor="middle">${p.n}</text>`;
  badges.appendChild(g);
 });
 document.getElementById("pic").addEventListener("click",e=>{
  const t=e.target.closest("[data-n]"); if(!t) return;
  colour(+t.dataset.n);
 });
}

function colour(n){
 if(checked){ setStatus("Tap <b>Restart</b> to try again."); return; }
 if(!sel){ setStatus("⚠️ First tap a colour in the <b>KEY</b>."); speak("First choose a colour in the key."); return; }
 chosen[n]=sel; draw(); fillTable();
 const p=PLACES.find(x=>x.n===n), t=typeById(sel);
 setStatus(`Number <b>${n}</b> (${p.see}) is coloured <b style="color:${t.color}">${t.name}</b>. ${Object.keys(chosen).length} of 9 done.`);
}

function draw(showAns){
 const f=document.getElementById("fills"); f.innerHTML="";
 PLACES.forEach(p=>{
  const id = showAns ? p.ans : chosen[p.n]; if(!id) return;
  const c=typeById(id).color;
  p.polys.forEach(pts=>{const el=document.createElementNS(NS,"polygon");el.setAttribute("points",pts);el.setAttribute("fill",c);el.setAttribute("fill-opacity",".5");el.setAttribute("stroke",c);el.setAttribute("stroke-width","6");el.style.pointerEvents="none";f.appendChild(el);});
 });
 document.querySelectorAll(".badge").forEach(g=>{
  const n=+g.dataset.n, id= showAns ? PLACES.find(p=>p.n===n).ans : chosen[n];
  g.querySelector("circle").setAttribute("fill", id? typeById(id).color : "#fff");
 });
}

function fillTable(withMarks, showAns){
 const tb=document.getElementById("tbl");
 document.getElementById("thMark").textContent = withMarks? "Mark":"";
 tb.rows[0].cells[3].textContent = showAns? "Correct land use" : "My land use";
 tb.innerHTML=tb.rows[0].outerHTML + PLACES.map(p=>{
  const id = showAns? p.ans : chosen[p.n]; const t=id?typeById(id):null;
  const ok = chosen[p.n]===p.ans;
  return `<tr><td><b>${p.n}</b></td><td>${p.see}</td><td class="sw" style="background:${t?t.color:"#fff"}"></td><td>${t? t.icon+" "+t.name : "—"}</td><td>${withMarks? (ok?'<span class="ok">✓ 1</span>':'<span class="no">✗ 0</span><br><small>'+typeById(p.ans).name+'</small>'):""}</td></tr>`;
 }).join("");
}

function marks(){
 const m=document.getElementById("marks"); m.innerHTML="";
 PLACES.forEach(p=>{
  const ok=chosen[p.n]===p.ans; const t=document.createElementNS(NS,"text");
  t.setAttribute("x",p.badge[0]+40); t.setAttribute("y",p.badge[1]-18); t.setAttribute("class","mark");
  t.setAttribute("fill", ok?"#1e7d3a":"#d00000"); t.setAttribute("stroke","#fff"); t.setAttribute("stroke-width","3"); t.setAttribute("paint-order","stroke");
  t.textContent= ok?"✓":"✗"; m.appendChild(t);
 });
}

document.getElementById("btnCheck").onclick=()=>{
 const done=Object.keys(chosen).length;
 if(done<9 && !confirm(`You coloured ${done} of 9 places. Check anyway?`)) return;
 checked=true; marks(); fillTable(true);
 const score=PLACES.filter(p=>chosen[p.n]===p.ans).length;
 const msg= score>=7 ? "Well done! 🌟" : score>=5 ? "Good try! Look at the ✗ and try again." : "Keep trying! Use the KEY to help you.";
 const r=document.getElementById("result");
 r.innerHTML=`Total marks: <b class="big">${score} / 9</b><br>${msg}`;
 r.style.display="block"; r.scrollIntoView({behavior:"smooth",block:"nearest"});
 speak(`You scored ${score} out of 9. ${msg.replace(/[🌟✗]/g,"")}`);
 setStatus("✓ = correct, ✗ = wrong. Tap <b>Show correct answers</b> or <b>Restart</b>.");
};
document.getElementById("btnShow").onclick=()=>{
 checked=true; draw(true); marks(); fillTable(true,true);
 setStatus("These are the correct colours. ✓ and ✗ show your answers.");
};
document.getElementById("btnRestart").onclick=()=>{
 chosen={}; checked=false; sel=null;
 document.querySelectorAll(".kbtn").forEach(x=>x.classList.remove("sel"));
 document.getElementById("marks").innerHTML=""; document.getElementById("result").style.display="none";
 draw(); fillTable();
 setStatus("1️⃣ Tap a colour in the <b>KEY</b>. &nbsp; 2️⃣ Tap a place on the picture to colour it.");
};
document.getElementById("btnPrint").onclick=()=>window.print();
document.getElementById("sayIntro").onclick=()=>speak("Land Use Detective. First, tap a colour in the key. Then tap a place on the picture to colour it. Colour all nine places. Then tap Check my answers.");

buildKey(); buildPic(); fillTable();
</script>
</body>
